services:
  api:
    build: .
    container_name: shadowfeed-api
    env_file: .env
    ports:
      - "3333:3333"
    restart: always
    networks:
      - shadowfeed

  nginx:
    image: nginx:alpine
    container_name: shadowfeed-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always
    networks:
      - shadowfeed

  certbot:
    image: certbot/certbot
    container_name: shadowfeed-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - shadowfeed

networks:
  shadowfeed:
    driver: bridge
